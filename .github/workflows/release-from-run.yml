name: 发布已有构建产物 (Release from Run)

# 适配 Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "已完成构建的 Workflow Run ID (例如: 40120719954)"
        required: true
        type: string
      version_tag:
        description: "自定义版本标签 (可选，留空自动生成)"
        required: false
        type: string
        default: ""
      release_title:
        description: "自定义发布标题 (可选，留空自动生成)"
        required: false
        type: string
        default: ""
      is_prerelease:
        description: "是否为预发布 (Pre-Release)"
        type: boolean
        default: false

jobs:
  release-run:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 下载目标构建产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p downloaded-artifacts
          echo "正在从 Workflow Run ID: ${{ inputs.run_id }} 下载产物..."
          gh run download "${{ inputs.run_id }}" --dir ./downloaded-artifacts

      - name: 验证并准备发布文件
        run: |
          mkdir -p ./release-files
          find ./downloaded-artifacts -type f -name '*AnyKernel3.zip' | while read -r file; do
            echo "发现内核包: $file"
            cp "$file" ./release-files/
          done
          find ./downloaded-artifacts -type f -name '*AIO-REJ.zip' | while read -r rej; do
            echo "发现补丁冲突包: $rej"
            cp "$rej" ./release-files/
          done

          COUNT=$(find ./release-files -type f | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::未在 Run ID ${{ inputs.run_id }} 中找到可发布的 AnyKernel3 产物。"
            exit 1
          fi
          echo "可发布文件总数: $COUNT"

      - name: 生成版本标签与标题
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -n "${{ inputs.version_tag }}" ]; then
            TAG_NAME="${{ inputs.version_tag }}"
          else
            FIRST_ZIP=$(find ./release-files -type f -name '*AnyKernel3.zip' | head -n 1)
            ZIP_BASE=$(basename "$FIRST_ZIP" | sed 's/-AnyKernel3\.zip//; s/\.zip//')
            if [ -n "$ZIP_BASE" ]; then
              TAG_NAME="$ZIP_BASE"
            else
              TAG_NAME="release-$(date +'%Y%m%d-%H%M%S')"
            fi
          fi

          if [ -n "${{ inputs.release_title }}" ]; then
            TITLE="${{ inputs.release_title }}"
          else
            TITLE="GKI 内核发布: $TAG_NAME"
          fi

          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=$TITLE" >> "$GITHUB_ENV"

      - name: 生成发布说明
        run: |
          cat > release_body.md << EOF
          ## 📦 GKI 内核构建发布

          - **源构建运行 (Workflow Run)**: [#${{ inputs.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ inputs.run_id }})
          - **触发分支**: \`${{ github.ref_name }}\`

          ### 📝 提交变更记录 / Commit Changes

          EOF

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            echo "**Commits since $LAST_TAG:**" >> release_body.md
            git log "${LAST_TAG}..HEAD" --pretty=format:"- [%h](https://github.com/${{ github.repository }}/commit/%H) - %s (%an)" --no-merges >> release_body.md || true
          else
            echo "**Recent commits:**" >> release_body.md
            git log -n 10 --pretty=format:"- [%h](https://github.com/${{ github.repository }}/commit/%H) - %s (%an)" --no-merges >> release_body.md || true
          fi

      - name: 创建 GitHub Release 并上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.is_prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG_NAME" \
            --title "$RELEASE_TITLE" \
            --notes-file release_body.md \
            --generate-notes \
            $PRERELEASE_FLAG \
            ./release-files/*

      - name: 构建摘要
        run: |
          echo "## 发布已成功创建" >> $GITHUB_STEP_SUMMARY
          echo "- **标签**: $TAG_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **标题**: $RELEASE_TITLE" >> $GITHUB_STEP_SUMMARY
          echo "- **链接**: https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME" >> $GITHUB_STEP_SUMMARY
